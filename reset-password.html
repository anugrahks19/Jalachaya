<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset password — Jalachaya</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container auth-page"><section class="card auth-card">
    <h1>Reset your password</h1>
    <div id="resetMessage" role="status"></div>
    <p id="recoveryHelp">For this local installation, ask the computer's administrator to run <strong>recover-account.cmd</strong> in the project folder. It opens a private reset link for your account, valid for 30 minutes.</p>
    <form id="resetForm" class="hidden">
      <div class="form-group"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
      <div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
      <button class="btn" id="resetButton" type="submit">Change password</button>
    </form>
    <p class="mt-2"><a href="login.html">Back to login</a></p>
  </section></main>
  <script src="js/config.js"></script><script src="js/constants.js"></script>
  <script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body></html>
