# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  # 1. Java Spring Boot REST API Backend
  - type: web
    name: jalachaya-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://jalachaya.onrender.com,https://*.onrender.com,http://localhost:5500
      - key: ENABLE_JUDGE_DEMO
        value: "true"
      - key: AI_ENABLED
        value: "false"

  # 2. Static Frontend (Portals, maps, pond timelines)
  - type: web
    name: jalachaya
    runtime: static
    staticPublishPath: .

